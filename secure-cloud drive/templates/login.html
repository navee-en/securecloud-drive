<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

      <link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="auth-box">

        <h2>Login</h2>

        <form method="POST">

            <input
               type="email"
               name="email"
               placeholder="Email"
               required>

            <input
                type="password"
                name="password"
                placeholder="Password"
                required>

            <button type="submit">

               Login

            </button>

            <a href="{{ url_for('google.login') }}"
                class="btn google-btn">

                Login with Google
            </a>

        </form>

        <a href="/register">

            Create Account

        </a>

    </div>

</body>
</html>
